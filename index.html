<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f8b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GST Invoice Generator</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#1c2530;--muted:#66717e;--line:#d9dee4;--accent:#1f5f8b;--on:#fff;--field:#f7f9fb;--tint:#e3eef7;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--panel:#1a2129;--ink:#e8edf2;--muted:#93a0ad;--line:#2b3540;--accent:#5aa6d6;--on:#0c1116;--field:#151b22;--tint:#1f3345;--err:#f2b8b5}}
:root[data-theme="dark"]{--bg:#12171d;--panel:#1a2129;--ink:#e8edf2;--muted:#93a0ad;--line:#2b3540;--accent:#5aa6d6;--on:#0c1116;--field:#151b22;--tint:#1f3345;--err:#f2b8b5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button.on{background:var(--tint);color:var(--accent);border-color:var(--accent);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.hd{font-weight:600;margin:0 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink);font:inherit;font-size:14px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-size:14px;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:8px 14px}
button.p{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}
.chips{margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;font-size:13px;background:var(--field)}
.chip span{padding:4px 8px;cursor:pointer}
.chip b{padding:4px 8px;cursor:pointer;color:var(--muted);font-weight:400;border-left:1px solid var(--line)}
.chip.sel{background:var(--tint);border-color:var(--accent);color:var(--accent)}
.mut{color:var(--muted);font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tg{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);cursor:pointer;margin:0}
.tg input{width:auto}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
th{text-align:left;font-weight:600;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line);font-size:12px}
td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td input,td select{padding:6px;font-size:13px}
.r{text-align:right}
.tot{margin-left:auto;width:260px;font-size:14px;margin-top:12px}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .gt{border-top:1px solid var(--ink);margin-top:4px;padding-top:6px;font-weight:700;font-size:16px}
.words{background:var(--field);border-radius:6px;padding:8px 12px;font-size:14px;margin-top:12px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.err{color:var(--err);font-size:13px;margin:8px 0 0;min-height:18px}
.paper{background:#fff;color:#1c2530;border:1px solid var(--line);border-radius:6px;padding:28px;font-size:13px;overflow-x:auto}
.paper .mut{color:#66717e}
.paper table{min-width:520px}
.paper th{color:#66717e;border-bottom:1px solid #1c2530}
.paper td{border-bottom:1px solid #e3e7ec;padding:7px 4px}
.paper .tot .gt{border-top:1px solid #1c2530}
.paper .words{background:#f1f4f7}
.logo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.logo-row img{max-height:48px;max-width:160px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px;vertical-align:middle;margin-right:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tabs{flex-wrap:nowrap;overflow-x:auto}.tabs button{white-space:nowrap}
.ok{color:var(--accent);font-size:13px;min-height:18px;margin:8px 0 0}
@media(max-width:600px){
 .app{padding:10px}
 input,select{font-size:16px}
 button{min-height:42px}
 .tot{width:100%}
 .paper{padding:16px}
 #tbl,#tbl tbody{display:block}
 #tbl{min-width:0}
 #tbl thead,#tbl colgroup{display:none}
 #tbl tr{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
 #tbl td{display:block;border:0;padding:0}
 #tbl td::before{content:attr(data-l);display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
 #tbl td:first-child{grid-column:1/-1}
 #tbl td.r{text-align:left}
}
@media print{
 body{background:#fff}body *{visibility:hidden}
 #inv,#inv *{visibility:visible}
 #inv{position:absolute;left:0;top:0;width:100%;border:0;padding:0}
}
</style>
</head>
<body>
<div class="app">
<h1>GST invoice generator</h1>
<div class="tabs" id="tabs"></div>

<section id="s0">
 <div class="card"><p class="hd">Seller details</p><div class="g" id="f-seller"></div>
 <div class="logo-row"><div><label for="logo">Logo (shown at the top of the invoice)</label><input id="logo" type="file" accept="image/*"></div><div id="logoui"></div></div>
 <div class="chips" id="c-seller"></div>
 <div style="margin-top:12px"><button id="save-seller">Save seller</button></div></div>
 <div class="nav"><span></span><button class="p" data-go="1">Next: buyer</button></div>
</section>

<section id="s1">
 <div class="card"><p class="hd">Buyer details</p><div class="g" id="f-buyer"></div>
 <div class="chips" id="c-buyer"></div>
 <div style="margin-top:12px"><button id="save-buyer">Save buyer for next time</button></div></div>
 <div class="nav"><button data-go="0">Back</button><button class="p" data-go="2">Next: items</button></div>
</section>

<section id="s2">
 <div class="card"><div class="g">
  <div><label for="no">Invoice number</label><input id="no"></div>
  <div><label for="dt">Invoice date</label><input id="dt" type="date"></div></div></div>
 <div class="card">
  <div class="row" style="margin-bottom:10px"><p class="hd" style="margin:0">Items</p>
  <label class="tg"><input type="checkbox" id="hsn"> Show HSN/SAC code</label></div>
  <div class="tw"><table id="tbl"></table></div>
  <p class="mut" style="margin:8px 0 0">Choosing CGST fills SGST with the same rate. You can change either one.</p>
  <div style="margin-top:10px"><button id="add">Add item</button></div>
  <div class="tot" id="tot"></div><div class="words" id="w1"></div>
 </div>
 <div class="card">
  <div class="row" style="margin-bottom:10px"><p class="hd" style="margin:0">Bank details</p>
  <label class="tg"><input type="checkbox" id="showbank"> Show bank details on invoice</label></div>
  <div id="bankbox"><div class="g" id="f-bank"></div><div class="chips" id="c-bank"></div>
  <div style="margin-top:12px"><button id="save-bank">Save bank account</button></div></div>
 </div>
 <div class="err" id="err" role="alert"></div>
 <div class="nav"><button data-go="1">Back</button><button class="p" data-go="3">Preview invoice</button></div>
</section>

<section id="s3">
 <div class="paper" id="inv"></div>
 <div class="ok" id="msg" role="status"></div>
 <div class="nav" style="margin-top:8px;flex-wrap:wrap"><button data-go="2">Edit invoice</button><button id="saveinv">Save invoice</button><button class="p" id="print">Print or save as PDF</button></div>
</section>

<section id="s4">
 <div class="row" style="margin-bottom:12px"><p class="hd" style="margin:0">Generated invoices</p><button class="p" data-newinv="1">Start new invoice</button></div>
 <div id="hist"></div>
</section>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var KEY="gst-invoice-app-v1";
var F={seller:[["name","Business name"],["gstin","GSTIN"],["address","Address"],["state","State"],["phone","Phone"],["email","Email"]],
buyer:[["name","Buyer name"],["gstin","GSTIN (optional)"],["address","Billing address"],["state","State"]],
bank:[["holder","Account holder"],["bank","Bank and branch"],["acc","Account number"],["ifsc","IFSC"]]};
var RATES=[0,1.25,2.5,6,9,14];
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var S={saved:{seller:[],buyer:[],bank:[]},cur:{seller:{},buyer:{},bank:{}},hist:[],hsn:true,showBank:true,no:"INV-001",date:today(),items:[{n:"",h:"",q:1,p:0,c:9,s:9}]};
try{var L=JSON.parse(localStorage.getItem(KEY)||"null");if(L)for(var k in L)S[k]=L[k]}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fm(x){return "₹ "+x.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function fd(v){if(!v)return"";var p=v.split("-");return new Date(+p[0],p[1]-1,+p[2]).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}

var ones=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
var tens=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
function two(n){return n<20?ones[n]:tens[Math.floor(n/10)]+(n%10?" "+ones[n%10]:"")}
function three(n){var s="";if(n>=100){s=ones[Math.floor(n/100)]+" Hundred";n%=100;if(n)s+=" "}return s+(n?two(n):"")}
function words(v){
var r=Math.floor(v),p=Math.round((v-r)*100);if(p==100){r++;p=0}
if(!r&&!p)return"Zero Rupees Only";
var a=[],u=[[10000000,"Crore"],[100000,"Lakh"],[1000,"Thousand"]];
u.forEach(function(x){var c=Math.floor(r/x[0]);if(c){a.push((c<100?two(c):three(c))+" "+x[1]);r%=x[0]}});
if(r)a.push(three(r));
var o=a.length?"Rupees "+a.join(" "):"";
if(p)o+=(o?" and ":"")+two(p)+" Paise";
return o+" Only"}

function calc(){var t=0,cg=0,sg=0;S.items.forEach(function(i){var a=i.q*i.p;t+=a;cg+=a*i.c/100;sg+=a*i.s/100});return{t:t,cg:cg,sg:sg,tot:t+cg+sg}}
function totals(){var c=calc();return '<div><span>Taxable value</span><span>'+fm(c.t)+'</span></div><div><span>CGST</span><span>'+fm(c.cg)+'</span></div><div><span>SGST</span><span>'+fm(c.sg)+'</span></div><div class="gt"><span>Total</span><span>'+fm(c.tot)+'</span></div>'}
function wd(){return '<b>Amount in words:</b> '+words(Math.round(calc().tot*100)/100)}

function build(kind){
$("f-"+kind).innerHTML=F[kind].map(function(f){return '<div><label>'+f[1]+'</label><input data-kind="'+kind+'" data-f="'+f[0]+'"></div>'}).join("");fill(kind);chips(kind)}
function fill(kind){document.querySelectorAll('[data-kind="'+kind+'"]').forEach(function(i){i.value=S.cur[kind][i.dataset.f]||""})}
function label(kind,o){return kind=="bank"?((o.bank||"Bank").split(",")[0]+" ····"+String(o.acc||"").slice(-4)):(o.name||"Unnamed")}
function chips(kind){
var cur=JSON.stringify(S.cur[kind]);
$("c-"+kind).innerHTML=S.saved[kind].length?S.saved[kind].map(function(o,i){return '<span class="chip'+(JSON.stringify(o)==cur?' sel':'')+'"><span data-pick="'+kind+':'+i+'">'+esc(label(kind,o))+'</span><b data-del="'+kind+':'+i+'" title="Remove" role="button" aria-label="Remove">×</b></span>'}).join(""):'<span class="mut">No saved '+kind+' yet. Fill the fields and save.</span>'}
function saveParty(kind){
var o=Object.assign({},S.cur[kind]);var key=kind=="bank"?"acc":"name";
if(!o[key]){$("err").textContent="";return}
var l=S.saved[kind],ix=-1;l.forEach(function(x,i){if(x[key]==o[key])ix=i});
if(ix>=0)l[ix]=o;else l.push(o);save();chips(kind)}

function items(){
var h=S.hsn;
var w=h?[22,12,8,14,12,12,20]:[28,8,16,14,14,20];
$("tbl").innerHTML='<colgroup>'+w.map(function(x){return '<col style="width:'+x+'%">'}).join("")+'</colgroup><thead><tr><th>Item</th>'+(h?'<th>HSN/SAC</th>':'')+'<th>Qty</th><th>Unit price</th><th>CGST %</th><th>SGST %</th><th class="r">Amount</th></tr></thead><tbody>'+
S.items.map(function(i,k){return '<tr><td><input data-k="'+k+'" data-f="n" value="'+esc(i.n)+'" placeholder="Item name"></td>'+(h?'<td><input data-k="'+k+'" data-f="h" value="'+esc(i.h)+'" placeholder="Optional"></td>':'')+
'<td><input type="number" min="0" step="any" data-k="'+k+'" data-f="q" value="'+i.q+'"></td><td><input type="number" min="0" step="any" data-k="'+k+'" data-f="p" value="'+i.p+'"></td><td>'+sel(k,"c",i.c)+'</td><td>'+sel(k,"s",i.s)+'</td><td class="r"><div id="a'+k+'">'+fm(amt(i))+'</div>'+(S.items.length>1?'<button data-rm="'+k+'" aria-label="Remove item" style="padding:2px 8px;margin-top:4px">×</button>':'')+'</td></tr>'}).join("")+'</tbody>';
var hs=[].map.call($("tbl").querySelectorAll("thead th"),function(t){return t.textContent});
[].forEach.call($("tbl").querySelectorAll("tbody tr"),function(r){[].forEach.call(r.children,function(td,i){td.setAttribute("data-l",hs[i]||"")})});
sums()}
function amt(i){return i.q*i.p*(1+(i.c+i.s)/100)}
function sel(k,f,v){var o=RATES.slice();if(o.indexOf(v)<0)o.push(v);return '<select data-k="'+k+'" data-f="'+f+'">'+o.map(function(r){return '<option'+(r==v?' selected':'')+'>'+r+'</option>'}).join("")+'</select>'}
function sums(){$("tot").innerHTML=totals();$("w1").innerHTML=wd();S.items.forEach(function(i,k){var e=$("a"+k);if(e)e.textContent=fm(amt(i))})}

function preview(){
var s=S.cur.seller,b=S.cur.buyer,bk=S.cur.bank,h=S.hsn;
function ln(o,a){return a.map(function(x){return o[x]?esc(o[x]):""}).filter(Boolean).join("<br>")}
var rows=S.items.map(function(i,k){var a=i.q*i.p;return '<tr><td>'+(k+1)+'</td><td>'+esc(i.n||"-")+'</td>'+(h?'<td>'+esc(i.h||"-")+'</td>':'')+'<td>'+i.q+'</td><td>'+fm(+i.p)+'</td><td>'+i.c+'%<br><span class="mut">'+fm(a*i.c/100)+'</span></td><td>'+i.s+'%<br><span class="mut">'+fm(a*i.s/100)+'</span></td><td class="r">'+fm(amt(i))+'</td></tr>'}).join("");
$("inv").innerHTML=
'<div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid #1f5f8b;padding-bottom:12px;margin-bottom:14px"><div>'+(s.logo?'<img src="'+s.logo+'" alt="Logo" style="max-height:64px;max-width:200px;display:block;margin-bottom:8px">':'')+'<div style="font-size:22px;font-weight:700;margin-bottom:4px">Tax invoice</div><div style="font-weight:600">'+esc(s.name)+'</div><div class="mut">'+ln(s,["address","state"])+(s.gstin?'<br>GSTIN '+esc(s.gstin):'')+(s.phone||s.email?'<br>'+[s.phone,s.email].filter(Boolean).map(esc).join(", "):'')+'</div></div>'+
'<div style="text-align:right"><div class="mut">Invoice no.</div><div style="font-weight:600">'+esc(S.no)+'</div><div class="mut" style="margin-top:6px">Date</div><div>'+fd(S.date)+'</div></div></div>'+
'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:14px"><div><div class="mut">Bill to</div><div style="font-weight:600">'+esc(b.name)+'</div><div>'+ln(b,["address"])+(b.gstin?'<br>GSTIN '+esc(b.gstin):'')+'</div></div>'+(b.state?'<div><div class="mut">Place of supply</div><div>'+esc(b.state)+'</div></div>':'')+'</div>'+
'<table><thead><tr><th>#</th><th>Item</th>'+(h?'<th>HSN/SAC</th>':'')+'<th>Qty</th><th>Rate</th><th>CGST</th><th>SGST</th><th class="r">Amount</th></tr></thead><tbody>'+rows+'</tbody></table>'+
'<div class="tot">'+totals()+'</div><div class="words">'+wd()+'</div>'+
'<div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:18px">'+
(S.showBank&&(bk.acc||bk.bank)?'<div><div class="mut">Bank details</div><div>'+ln(bk,["holder","bank"])+(bk.acc?'<br>A/c no. '+esc(bk.acc):'')+(bk.ifsc?'<br>IFSC '+esc(bk.ifsc):'')+'</div></div>':'<div></div>')+
'<div style="text-align:right;align-self:flex-end"><div class="mut">For '+esc(s.name)+'</div><div style="height:40px"></div><div class="mut">Authorised signatory</div></div></div>'}

function logoUI(){var l=S.cur.seller.logo;$("logoui").innerHTML=l?'<img src="'+l+'" alt="Logo preview"><button id="logo-rm">Remove logo</button>':'<span class="mut">No logo added</span>'}
$("logo").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=Math.min(1,400/im.width,160/im.height),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*m));c.height=Math.max(1,Math.round(im.height*m));c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.cur.seller.logo=c.toDataURL("image/png");save();logoUI();chips("seller")};im.src=r.result};r.readAsDataURL(f);this.value=""};
function inc(n){n=String(n||"INV-001");return /\d/.test(n)?n.replace(/(\d+)(\D*)$/,function(m,d,r){return String(+d+1).padStart(d.length,"0")+r}):n+"-2"}
function snap(){return JSON.parse(JSON.stringify({cur:S.cur,items:S.items,hsn:S.hsn,showBank:S.showBank,no:S.no,date:S.date}))}
function saveInv(){var o={no:S.no,date:S.date,buyer:S.cur.buyer.name||"",total:Math.round(calc().tot*100)/100,at:Date.now(),snap:snap()},ix=-1;S.hist.forEach(function(h,i){if(h.no==o.no)ix=i});if(ix>=0)S.hist[ix]=o;else S.hist.unshift(o);save();$("msg").textContent="Saved to Invoices"}
function sync(){["seller","buyer","bank"].forEach(function(k){fill(k);chips(k)});$("no").value=S.no;$("dt").value=S.date;$("hsn").checked=S.hsn;$("showbank").checked=S.showBank;$("bankbox").style.display=S.showBank?"block":"none";logoUI();items()}
function loadInv(i,to){var s=JSON.parse(JSON.stringify(S.hist[i].snap));S.cur=s.cur;S.items=s.items;S.hsn=s.hsn;S.showBank=s.showBank;S.no=s.no;S.date=s.date;save();sync();go(to)}
function hist(){
$("hist").innerHTML=S.hist.length?S.hist.map(function(h,i){return '<div class="card"><div class="row"><div><b>'+esc(h.no)+'</b> <span class="mut">'+fd(h.date)+'</span><div>'+esc(h.buyer||"No buyer name")+'</div></div><div style="font-weight:700;font-size:16px">'+fm(h.total)+'</div></div><div class="acts"><button data-open="'+i+'">View</button><button data-edit="'+i+'">Edit</button><button data-delh="'+i+'">Delete</button></div></div>'}).join(""):'<div class="card"><p class="hd">No invoices yet</p><p class="mut" style="margin:0">Create an invoice, open the preview, and choose Save invoice. It will appear here.</p></div>'}
function newInv(){var last=S.hist.length?S.hist.slice().sort(function(a,b){return b.at-a.at})[0].no:S.no;S.no=inc(last);S.date=today();S.items=[{n:"",h:"",q:1,p:0,c:9,s:9}];S.cur.buyer={};save();sync();go(1)}
var names=["1 Seller","2 Buyer","3 Items and GST","4 Preview","Invoices"],step=0;
$("tabs").innerHTML=names.map(function(n,i){return '<button data-go="'+i+'">'+n+'</button>'}).join("");
function go(n){
var e="";
if(n==3){
 if(!S.cur.seller.name)e="Enter the seller's business name in step 1.";
 else if(!S.cur.buyer.name)e="Enter the buyer's name in step 2.";
 else if(!S.items.some(function(i){return i.n&&i.q>0}))e="Add at least one item with a name and quantity.";
 if(e){$("err").textContent=e;n=2}
}
if(n!=3||!e)$("err").textContent=e;
step=n;
for(var i=0;i<5;i++)$("s"+i).style.display=i==n?"block":"none";
document.querySelectorAll("#tabs button").forEach(function(b,i){b.className=i==n?"on":""});
if(n==3){preview();$("msg").textContent=""}
if(n==4)hist();
window.scrollTo(0,0)}

document.addEventListener("input",function(e){
var t=e.target,d=t.dataset;
if(d.kind){S.cur[d.kind][d.f]=t.value;save();chips(d.kind)}
else if(d.k!=null&&t.tagName=="INPUT"){var it=S.items[d.k];it[d.f]=(d.f=="n"||d.f=="h")?t.value:(parseFloat(t.value)||0);save();sums()}
else if(t.id=="no"){S.no=t.value;save()}else if(t.id=="dt"){S.date=t.value;save()}});
document.addEventListener("change",function(e){
var t=e.target,d=t.dataset;
if(d.k!=null&&t.tagName=="SELECT"){var it=S.items[d.k];it[d.f]=+t.value;if(d.f=="c")it.s=+t.value;save();items()}
else if(t.id=="hsn"){S.hsn=t.checked;save();items()}
else if(t.id=="showbank"){S.showBank=t.checked;$("bankbox").style.display=t.checked?"block":"none";save()}});
document.addEventListener("click",function(e){
var t=e.target,d=t.dataset;
if(d.go!=null)go(+d.go);
else if(d.pick){var p=d.pick.split(":");S.cur[p[0]]=Object.assign({},S.saved[p[0]][+p[1]]);fill(p[0]);chips(p[0]);save()}
else if(d.del){var q=d.del.split(":");S.saved[q[0]].splice(+q[1],1);save();chips(q[0])}
else if(d.rm!=null){S.items.splice(+d.rm,1);save();items()}
else if(d.open!=null)loadInv(+d.open,3)
else if(d.edit!=null)loadInv(+d.edit,2)
else if(d.delh!=null){if(confirm("Delete this invoice?")){S.hist.splice(+d.delh,1);save();hist()}}
else if(d.newinv)newInv()
else if(t.id=="logo-rm"){delete S.cur.seller.logo;save();logoUI();chips("seller")}
else if(t.id=="saveinv")saveInv()
else if(t.id&&t.id.indexOf("save-")==0)saveParty(t.id.slice(5))});
$("add").onclick=function(){S.items.push({n:"",h:"",q:1,p:0,c:9,s:9});save();items()};
$("print").onclick=function(){saveInv();window.print()};

["seller","buyer","bank"].forEach(build);
$("no").value=S.no;$("dt").value=S.date;$("hsn").checked=S.hsn;$("showbank").checked=S.showBank;$("bankbox").style.display=S.showBank?"block":"none";
logoUI();items();go(0);
})();
</script>
</body>
</html>
